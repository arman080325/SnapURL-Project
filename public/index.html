<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapURL | Professional URL Shortener</title>
  <meta name="description" content="Sophisticated, fast, and secure URL shortener.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="header-top-row">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          <h1 class="main-title">SnapURL</h1>
        </div>
        <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
      <p class="subtitle">Lightning-fast, reliable, and secure URL shortening.</p>
    </header>

    <div class="glass-panel main-card">
      <form id="shorten-form" class="form-container">
        
        <div class="input-wrapper main-input">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          <input 
            type="url" 
            id="original-url" 
            placeholder="Paste your long URL here..." 
            required 
            autocomplete="off"
          />
          <button type="submit" id="submit-btn" class="primary-btn">
            <span>Shorten</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
        
        <div class="options-trigger" id="options-toggle">
          <span class="options-text">Configure Advanced Options</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>

        <div class="advanced-options-panel" id="advanced-options">
          <div class="options-grid">
            <div class="form-group">
              <label for="custom-alias">Custom Alias</label>
              <div class="input-wrapper slim-input">
                <span class="prefix">snap.url/</span>
                <input type="text" id="custom-alias" placeholder="your-brand" pattern="[a-zA-Z0-9-_]+" title="Letters, numbers, hyphens, underscores." autocomplete="off" />
              </div>
            </div>
            
            <div class="form-group">
              <label for="expires-at">Expiration Date</label>
              <div class="input-wrapper slim-input">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <input type="datetime-local" id="expires-at" class="date-picker" />
              </div>
            </div>
          </div>
        </div>
      </form>

      <div id="state-layer" class="state-layer">
        <!-- Loading State -->
        <div id="loading" class="state-content hidden">
          <div class="nexus-spinner"></div>
          <p>Encrypting & Shortening...</p>
        </div>

        <!-- Success Result -->
        <div id="result-container" class="state-content result-view hidden">
          <div class="result-header">
            <div class="success-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Success
            </div>
          </div>
          
          <div class="result-layout">
            <div class="qr-container">
              <img id="qr-code-img" src="" alt="QR Code" width="120" height="120" />
            </div>
            
            <div class="result-details">
              <div class="short-link-display">
                <a href="#" id="short-url-link" target="_blank" rel="noopener noreferrer"></a>
              </div>
              
              <div class="action-row">
                <button id="copy-btn" class="secondary-btn flex-btn" aria-label="Copy">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  <span>Copy Link</span>
                </button>
                <button id="view-stats-btn" class="secondary-btn flex-btn view-stats">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                  <span>Analytics</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Error State -->
        <div id="error-message" class="state-content error-view hidden">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
          <p id="error-text">An error occurred.</p>
        </div>
      </div>
    </div>

    <!-- Recent Links Section -->
    <section class="recent-links-section hidden" id="recent-links-section">
      <div class="section-header">
        <h2>Recent Links</h2>
        <button id="clear-history-btn" class="text-link">Clear History</button>
      </div>
      <div class="links-list" id="links-list">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- Enhanced Analytics Modal -->
    <div class="nexus-modal hidden" id="stats-modal">
      <div class="modal-backdrop"></div>
      <div class="modal-surface glass-panel">
        <button class="modal-close" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="modal-header">
          <h2>Link Analytics</h2>
          <p class="mono-code" id="stat-shortcode">nexus.link/xyz</p>
        </div>
        <div class="analytics-dashboard">
          <div class="metric-card highlight">
            <div class="metric-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
            </div>
            <div class="metric-data">
              <span class="metric-label">Total Engagements</span>
              <span class="metric-value" id="stat-clicks">0</span>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <div class="metric-data">
              <span class="metric-label">Created At</span>
              <span class="metric-value date" id="stat-created">-</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="/app.js"></script>
</body>
</html>
